<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>勝利女神：妮姬 L2D 檢視器</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>

  <!-- 頂部標題列 -->
  <div class="titlebar">
    <h1>勝利女神：妮姬 L2D 檢視器</h1>
    <div class="win-btns">
      <button class="win-btn" onclick="require('electron').ipcRenderer.send('win-minimize')">─</button>
      <button class="win-btn" onclick="require('electron').ipcRenderer.send('win-maximize')">☐</button>
      <button class="win-btn close" onclick="require('electron').ipcRenderer.send('win-close')">✕</button>
    </div>
  </div>

  <div class="main-container">
    <!-- 左側控制台 -->
    <div class="left-panel">
      <div class="section-title">動畫與語音控制</div>

      <div class="control-group">
        <label>動作 (Animation)</label>
        <select id="anim-select"></select>
      </div>

      <div class="control-group">
        <label>點擊觸發語音範圍</label>
        <select id="voice-filter">
          <option value="lobby">僅大廳與基地點擊語音 (站姿)</option>
          <option value="cover">防守與換彈戰鬥語音 (Cover)</option>
          <option value="aim">攻擊與爆裂戰鬥語音 (Aim)</option>
          <option value="all">全部語音隨機 (含大廳與戰鬥)</option>
        </select>
      </div>

      <div class="control-group">
        <label>手動播放指定語音</label>
        <select id="voice-select"></select>
      </div>

      <div class="control-group">
        <label><span>動畫速度</span><span id="speed-label">1.00x</span></label>
        <input type="range" id="speed-slider" min="0.1" max="2.0" step="0.05" value="1.0" />
      </div>

      <div class="control-group">
        <label><span>角色縮放大小</span><span id="scale-label">100%</span></label>
        <input type="range" id="scale-slider" min="25" max="250" step="5" value="100" />
      </div>

      <div class="control-group">
        <label><span>旋轉角度</span><span id="rotation-label">0°</span></label>
        <input type="range" id="rotation-slider" min="0" max="360" step="1" value="0" />
      </div>

      <div class="control-group">
        <label><span style="color:#fb923c;">🎯 攻擊(Aim)抖動幅度</span><span id="aim-shake-label" style="color:#fb923c;">100%</span></label>
        <input type="range" id="aim-shake-slider" min="0" max="300" step="5" value="100" />
      </div>

      <div class="section-title">對話氣泡設定</div>

      <div class="control-group">
        <label><span>氣泡垂直偏移 (Y)</span><span id="bubble-y-label">-55px</span></label>
        <input type="range" id="bubble-y-slider" min="-250" max="250" step="5" value="-55" />
      </div>

      <div class="control-group">
        <label><span>氣泡水平偏移 (X)</span><span id="bubble-x-label">105px</span></label>
        <input type="range" id="bubble-x-slider" min="-250" max="250" step="5" value="105" />
      </div>

      <div class="control-group">
        <label><span>氣泡文字大小</span><span id="bubble-font-label">19px</span></label>
        <input type="range" id="bubble-font-slider" min="12" max="28" step="1" value="19" />
      </div>

      <div class="section-title">畫面與背景工具</div>

      <div class="btn-row">
        <button class="btn" id="reset-cam-btn">重置視角</button>
        <button class="btn" id="mirror-btn">⇄ 鏡射</button>
        <button class="btn btn-primary" id="pause-btn">暫停</button>
      </div>

      <div class="control-group">
        <label>背景顏色 (點選自動清除背景圖)</label>
        <input type="color" id="bg-color" value="#141720" style="width:100%; height:30px; border:none; border-radius:6px; cursor:pointer;" />
      </div>

      <div class="btn-row">
        <button class="btn" id="load-bg-btn">🖼️ 載入背景</button>
        <button class="btn" id="screenshot-btn">📸 截取畫面</button>
      </div>

      <button class="btn btn-pet" id="enter-pet-btn">🐾 開啟浮動桌寵</button>
    </div>

    <!-- 中央 Spine 畫布 -->
    <div class="center-stage" id="stage-container">
      <!-- 左上角快捷工具列 -->
      <div class="canvas-toolbar">
        <button class="tool-icon" onclick="zoomBy(0.85)" title="放大">＋</button>
        <button class="tool-icon" onclick="zoomBy(1.15)" title="縮小">－</button>
        <button class="tool-icon" id="toolbar-rot-ccw" title="逆時針旋轉 15°">↺</button>
        <button class="tool-icon" id="toolbar-rot-cw" title="順時針旋轉 15°">↻</button>
        <button class="tool-icon" id="toolbar-mirror" title="左右鏡射">⇄</button>
      </div>

      <!-- 右上角最愛與姿勢切換按鈕組 -->
      <div class="pose-switcher" id="pose-switcher">
        <button class="fav-action-btn" id="fav-toggle-btn">☆ 加入我的最愛</button>
        <button class="pose-btn active" id="pose-standing-btn" data-pose="standing">🧜‍♀️ 全身 (Full)</button>
        <button class="pose-btn" id="pose-cover-btn" data-pose="cover">🛡️ Cover</button>
        <button class="pose-btn" id="pose-aim-btn" data-pose="aim">🎯 Aim</button>
      </div>

      <!-- 對話氣泡 -->
      <div id="speech-bubble">
        <div class="char-tag" id="bubble-name">拉毗</div>
        <div id="bubble-text">我正在等待命令。</div>
      </div>

      <canvas id="spine-canvas"></canvas>

      <!-- 桌寵模式懸浮控制條 (滑鼠靠近立繪顯示 4 秒) -->
      <div id="pet-Floating-Bar">
        <span class="pet-hint">💡 直接按住角色即可全螢幕拖曳</span>
        <button class="btn" style="padding:5px 12px; font-size:12px; background:#4f46e5;" id="exit-pet-btn">返回主控台</button>
      </div>
    </div>

    <!-- 右側角色清單 -->
    <div class="right-panel">
      <div class="tab-bar">
        <button class="tab-btn active" id="tab-all-btn">所有妮姬</button>
        <button class="tab-btn" id="tab-fav-btn">⭐ 我的最愛</button>
      </div>
      <input type="text" id="search-input" placeholder="搜尋角色、時裝..." />
      <div class="char-list" id="char-list"></div>
    </div>
  </div>

  <script src="./js/app.js"></script>
</body>
</html>
